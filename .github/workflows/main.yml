name: Docs

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-libraries]
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/load-manifest.py"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "zensical.toml"

env:
  MC_VERSION: "1.20"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install zensical requests tomlkit

      - name: Update library versions from the manifest
        run: python .github/workflows/load-manifest.py

      - name: Build documentation
        run: zensical build --clean

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
