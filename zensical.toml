# Zensical configuration for the Smithed documentation.
# https://zensical.org/docs/setup/basics/

[project]
site_name = "Smithed Documentation"
site_description = "Your all-in-one guide to the Smithed ecosystem."
site_author = "Smithed Council"
site_url = "https://docs.smithed.dev"

copyright = """
Copyright &copy; Smithed Council
"""

repo_url = "https://github.com/Smithed-MC/docs"
repo_name = "Smithed-MC/docs"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Conventions" = [
    "conventions/index.md",
    "conventions/namespacing.md",
    "conventions/pack-ids.md",
    "conventions/cmd-prefixing.md",
    "conventions/vanilla-overrides.md",
    "conventions/tag-specification.md",
    "conventions/data-pack-menu.md",
  ]},
  { "Libraries" = [
    "libraries/index.md",
    "libraries/actionbar.md",
    # An empty section title makes Zensical use the section index page title,
    # so the label includes the library version (e.g. "Crafter (v0.4.3)").
    { "" = [
      "libraries/crafter/index.md",
      "libraries/crafter/data_types.md",
      "libraries/crafter/function_tag.md",
    ]},
    "libraries/custom-block.md",
    "libraries/damage.md",
    "libraries/item.md",
    "libraries/prevent-aggression.md",
    "libraries/title.md",
  ]},
  { "Weld" = [
    "weld/index.md",
    { "Merging" = [
      "weld/merging/index.md",
      "weld/merging/rule.md",
      "weld/merging/source.md",
      "weld/merging/priority.md",
      "weld/merging/condition.md",
      "weld/merging/mcmeta.md",
    ]},
  ]},
  { "Launcher" = "launcher/index.md" },
  { "API" = [
    "api/index.md",
    "api/data-types.md",
    "api/routes.md",
  ]},
  { "Guides" = [
    "guides/index.md",
    "guides/yellow-shulker-box.md",
  ]},
  { "Contributing" = "meta/contributing.md" },
  { "Project links" = [
    { "Smithed Github" = "https://github.com/Smithed-MC" },
    { "Smithed Website" = "https://smithed.dev" },
  ]},
]

extra_css = ["stylesheets/extra.css"]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
# The header logo is inlined via `overrides/partials/logo.html` so it can
# follow the header text color in both light and dark mode.
custom_dir = "overrides"
favicon = "assets/favicon.png"
language = "en"

features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Inconsolata"
code = "Inconsolata"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "custom"
accent = "custom"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "custom"
accent = "custom"

# ----------------------------------------------------------------------------
# Markdown
# ----------------------------------------------------------------------------
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
pymdownx.snippets.base_path = ["docs", "."]

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------
[project.plugins.macros]

# ----------------------------------------------------------------------------
# Variables available to Markdown via the macros plugin ({{ name }})
# These are updated automatically from the libraries manifest.
# ----------------------------------------------------------------------------
[project.extra]
actionbar_version = "0.5.0"
crafter_addon_version = "0.1.0"
crafter_version = "0.4.3"
custom_block_version = "0.4.3"
damage_version = "0.2.0"
enchanter_version = "0.1.0"
item_version = "0.3.0"
prevent_aggression_version = "0.3.0"
title_version = "0.0.1"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Smithed-MC"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/gkp6UqEUph"
